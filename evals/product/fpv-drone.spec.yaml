# anvil eval — the harness's reference PRODUCT build (end-to-end).
# A rugged 5" FPV quad: one custom board (power-distribution + FC carrier), the rest COTS —
# frame + canopy as CAD-as-code, full harness, product BOM, assembly package. Every product
# gate exercisable: mesh, fit, mass, mech-dfm, pinout, product-bom, sys-budget.
name: fpv-drone
summary: Rugged 5-inch FPV quadcopter — carrier PCB + COTS propulsion/video, printed frame furniture, full assembly kit
fab: jlcpcb
layers: 4

targets:
  bom_cost: { limit: 25.00, currency: USD, qty: 10 }        # the custom carrier board alone
  board_area: { limit: 1369, units: mm2 }                    # 37×37 fits 30.5 grid mounts
  product_cost: { limit: 320.00, currency: USD, qty: 1 }     # full-unit rollup, spares included
  auw_mass: { limit: 650, units: g }                         # all-up weight incl. battery

specs:
  # --- electronics (custom carrier PCB — full board pipeline) ---
  - { id: HR-1, text: "VBAT 4S–6S (13.2–25.2 V) distributed to 4 ESC pads, 5 V/3 A and 9 V/2 A rails",
      dimension: simulation, verify: simulation }
  - { id: HR-2, text: "5 V rail 5.0 V ± 3 % at 0–3 A over VBAT 13.2–25.2 V",
      dimension: simulation, verify: simulation }
  - { id: HR-3, text: "Survives reverse battery connection indefinitely (field swap under stress)",
      dimension: electrical, verify: simulation }
  - { id: HR-4, text: "Current sense 0–120 A ± 5 % reported to FC ADC",
      dimension: simulation, verify: simulation }
  - { id: HR-5, text: "Board 37 × 37 mm, 30.5 × 30.5 M3 pattern, ≤ 8 g assembled",
      dimension: layout, verify: inspection }
  - { id: HR-6, text: "Test points on VBAT, 5V, 9V, GND ×2, CURR; polarity marks at battery pads",
      dimension: testability, verify: inspection }
  # --- system (decomposition, budgets, COTS) ---
  - { id: HR-7, text: "Thrust-to-weight ≥ 2.0 at AUW with selected motors/props at hover derate 0.5",
      dimension: system, verify: analysis }
  - { id: HR-8, text: "Endurance ≥ 5 min hover on the selected battery at computed hover draw",
      dimension: system, verify: analysis }
  - { id: HR-9, text: "Product cost ≤ $320 @ qty 1 incl. spare props/arms, against pinned catalogs",
      dimension: system, verify: analysis }
  - { id: HR-10, text: "Every subsystem interface in the ICD; no decomposition orphans",
      dimension: system, verify: inspection }
  # --- mechanical (frame furniture: canopy, stack mounts, arm guards, battery tray) ---
  - { id: HR-11, text: "Canopy + tray printable FDM PETG: walls ≥ 1.6 mm, overhangs ≤ 55°, watertight meshes",
      dimension: mechanical, verify: analysis }
  - { id: HR-12, text: "FC stack fits canopy cavity: interference 0, ≥ 0.5 mm z-clearance, USB reachable",
      dimension: mechanical, verify: analysis }
  - { id: HR-13, text: "Stack bosses coaxial with 30.5 pattern within 0.1 mm; IMU on TPU isolators",
      dimension: mechanical, verify: analysis }
  - { id: HR-14, text: "Printed furniture ≤ 55 g total; arms/guards sacrificial and spared",
      dimension: mechanical, verify: analysis }
  - { id: HR-15, text: "Survives 1.5 m drop onto concrete: fillets ≥ 1.5 mm, guards absorb, electronics isolated",
      dimension: mechanical, verify: analysis }
  # --- integration (harness + assembly) ---
  - { id: HR-16, text: "Every power/signal ICD edge realized in the harness at legal ampacity",
      dimension: integration, verify: inspection }
  - { id: HR-17, text: "Assembly instructions a cold technician can follow; every step cites BOM ids",
      dimension: integration, verify: inspection }
  - { id: HR-18, text: "Integration ladder: smoke → config → bind/failsafe → motor order (props off) → armed tether test",
      dimension: integration, verify: inspection }
  - { id: HR-19, text: "VTX band/power within region table — human sign-off row, never loop-passed",
      dimension: integration, verify: inspection }

golden_connectivity:
  - "VBAT reaches every ESC pad pair through the current-sense shunt"
  - "reverse-battery element between XT60 and everything else"
  - "every regulator power pin has its decoupling declared in-block"
  - "FC ADC current-sense input driven from the shunt amplifier output, not the shunt directly"
  - "9 V rail feeds VTX only through the filtered (LC) branch"

sim_assertions:
  - { id: A-HR-2, measure: v5_avg, op: within, limit: "5.0±3%", units: V,
      corners: "vbat=13.2,25.2;iload=0.1,3", traces: HR-2 }
  - { id: A-HR-3, measure: irev_max, op: le, limit: "0.001", units: A,
      corners: "vbat=-25.2", traces: HR-3 }
  - { id: A-HR-4, measure: isense_err, op: le, limit: "0.05", units: "-",
      corners: "iload=10,60,120", traces: HR-4 }

product:
  subsystems:
    - { id: S-1, subsystem: carrier-fc, kind: electronics, realization: "boards/carrier/ + cots FC-1" }
    - { id: S-2, subsystem: propulsion, kind: cots, realization: "cots: MOT-1..4, ESC-1, PROP-1" }
    - { id: S-3, subsystem: power, kind: cots+harness, realization: "cots: BAT-1; harness W-1..2" }
    - { id: S-4, subsystem: airframe, kind: mechanical, realization: "cots: FRAME-1 + mech/cad/*" }
    - { id: S-5, subsystem: video, kind: cots, realization: "cots: CAM-1, VTX-1, ANT-1" }
    - { id: S-6, subsystem: radio, kind: cots, realization: "cots: RX-1" }
    - { id: S-7, subsystem: firmware, kind: firmware, realization: "assembly/config/" }
  cots:
    - { module_id: FC-1, role: flight-controller, key_specs: "F7, 30.5 grid, DShot600, 9 g" }
    - { module_id: MOT-1, role: propulsion, key_specs: "2207 1750KV, thrust@6S/5in 1650 g @ 34 A, 32 g" }
    - { module_id: ESC-1, role: propulsion, key_specs: "4-in-1 55 A cont, DShot600, 14 g" }
    - { module_id: BAT-1, role: power, key_specs: "6S 1300 mAh 120C, 28.9 Wh, 205 g" }
    - { module_id: VTX-1, role: video, key_specs: "5.8 GHz, 25–800 mW region-gated, 9 V feed" }
  mech:
    - { id: HR-12, assertions: "fit: interference_mm3 le 0; clearance_z_mm ge 0.5" }
    - { id: HR-13, assertions: "fit: boss_misalign_mm le 0.1" }
    - { id: HR-14, assertions: "mass: mass_g le 55" }
    - { id: HR-11, assertions: "dfm: wall_min_mm ge 1.6; overhang_max_deg le 55; mesh: defects 0" }
  budgets:
    - { id: B-1, quantity: mass, demand: "AUW from product-bom", capability: "4 × thrust@hover", derate: 0.5, traces: HR-7 }
    - { id: B-2, quantity: power, demand: "hover draw from thrust tables", capability: "battery C × Ah", derate: 0.8, traces: HR-8 }
    - { id: B-3, quantity: endurance, demand: "5 min", capability: "Wh / hover W", derate: 1.0, traces: HR-8 }
    - { id: B-4, quantity: cost, demand: "product-bom rollup", capability: "320 USD", derate: 1.0, traces: HR-9 }
  environment:
    ip: none            # open frame; canopy sheds spray only — stated, not implied
    vibration: "motor band 100–400 Hz; FC/IMU on TPU isolators (HR-13)"
    drop: "1.5 m onto concrete; arms + guards sacrificial, spares in BOM (HR-15)"
